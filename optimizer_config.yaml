# ==========================================
# LEYP OPTIMIZER CONFIGURATION
# ==========================================

# 1. FILE PATHS
master_input_file: "Louisa_wConduits_Input_CSV.csv"
output_base_dir: "Optimization_Results_NSGA2"

# 2. DATA PROCESSING
skip_segmentation: True

# 3. GENE BOUNDS (The "Search Space")
genes:
  budget: 
    min: 10000
    # Raised from 500000 to match the README (review finding B5): at the
    # original $120/inch-ft the network cost $84.4M to renew once, more than
    # $500k/yr could fund over the horizon. At $25/inch-ft renewal is $17.6M.
    max: 2000000
  rehab_trigger: 
    min: 1.0
    max: 3.5

# 4. ECONOMIC PARAMETERS
# Real annual discount rate applied to both objectives. Without it a dollar in
# year 100 counts the same as one today. 0.0 recovers undiscounted totals.
discount_rate: 0.03

# 5. SIMULATION DETERMINISM
# seed: base seed applied to every evaluation (common random numbers), so a
#   given (seed, budget, trigger) reproduces exactly.  Set to null for an
#   unseeded, non-reproducible run.
# n_replicates: stochastic replicates averaged per evaluation.  1 is a single
#   draw; raise it to average out simulation noise.
simulation:
  seed: 20260830
  # 5 replicates puts run-to-run spread at ~0.75% of the front's total-cost
  # range (sd $2.9M against a $383M spread); a single draw is ~3.2%.
  # Raised to 8: with wear-out the cost surface is flat above the optimum,
  # so the selected budget is noise-sensitive at fewer replicates.
  n_replicates: 8

# 6. VALIDATION CURVE
# Budget points swept from 0 to genes.budget.max. More points give a smoother
# curve at linear cost (each point is n_replicates simulations).
validation:
  n_points: 15

# 7. STRATEGY SELECTION
# Which Pareto-front strategy drives the Optimal Action Plan and is flagged
# "selected" on the charts and in selected_strategies.csv. All three are always
# marked and summarised, whichever is selected.
#   min_total_cost      - lowest investment + risk: where the front's slope is
#                         -1, so a dollar invested avoids a dollar of risk
#   knee                - closest to the ideal point once both objectives are
#                         min-max normalised; the best-balanced trade-off
#   max_marginal_return - the steepest stretch of the front (slope over a
#                         5-point window): best value per dollar, usually at low
#                         investment with high remaining risk; not a spend level
selection: knee
# The plateau: front strategies whose total is within this fraction of the
# minimum total. Shaded on the charts; strategies inside it are
# interchangeable to within the tolerance.
plateau_tolerance: 0.05

# 8. ALGORITHM SETTINGS
# Sized for a noisy two-gene objective: ~510 evaluations against the previous
# 50, which was too few to resolve a front from simulation noise. At roughly
# 1.3s per evaluation (5 replicates) a full run takes about 11 minutes.
algorithm:
  pop_size: 32
  n_offsprings: 16
  n_gen: 30
  seed: 895

# 9. OUTPUTS
# Write one action plan per strategy marked on the optimisation chart, named
# after its call-out: Action_Plan_Min_Total_Cost.csv,
# Action_Plan_Knee_Balanced.csv, Action_Plan_Max_Marginal_Return.csv. The
# selected one is identical to Optimal_Action_Plan.csv. About 30 s extra.
export_strategy_plans: true

# 10. DISCOUNT-RATE SENSITIVITY
# Re-optimises at each rate and tabulates the chosen strategy's average
# annual spend, failures (breaks) and strategy type per rate in
# discount_sensitivity.csv. Each extra rate is a full search (about 20 min at
# the settings above); the run's own rate reuses the main front.
# Run on demand with:  python leyp_optimizer.py --sensitivity-only
sensitivity:
  enabled: false
  discount_rates: [0.0, 0.03, 0.05]
  strategy: knee          # independent of `selection`
